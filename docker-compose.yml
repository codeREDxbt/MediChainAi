services:
  monai-service:
    build:
      context: ./monai-service
      dockerfile: Dockerfile
    container_name: medichain-monai
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - monai_model_cache:/app/.model_cache
    environment:
      - PORT=8000
      - RELOAD=false
      - MONAI_PRELOAD_MODEL=true
      - NEXTJS_ORIGIN=http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    container_name: medichain-nextjs
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - MONAI_SERVICE_URL=http://monai-service:8000
    depends_on:
      monai-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  monai_model_cache:
    driver: local
